name: pizzavoice

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PV_DATA_FILE: /data/app/db.json
      RUNTIME_DATA_DIR: /data/runtime
      APP_PUBLIC_URL: https://${APP_DOMAIN}
    volumes:
      - pizzavoice_data:/data
    expose:
      - "3000"
    depends_on:
      - runtime

  runtime:
    build: ./runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data/runtime
      PORT: "8080"
      PRODUCT_API_URL: http://app:3000
    volumes:
      - pizzavoice_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - runtime

volumes:
  pizzavoice_data:
  caddy_data:
  caddy_config:
