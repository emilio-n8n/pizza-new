services:
  - type: web
    name: pizzavoice-runtime
    runtime: node
    plan: free
    region: frankfurt
    rootDir: runtime
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Secrets à saisir dans le tableau de bord Render, jamais dans le dépôt.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      # L'app déployée sur Vercel : c'est elle que les outils interrogent.
      - key: PRODUCT_API_URL
        value: https://pizzavoice.vercel.app
      # Renseigné après le premier déploiement : https://<service>.onrender.com
      - key: PUBLIC_WS_URL
        sync: false
      - key: TTS_VOICE
        value: Kore
      - key: LOG_TRANSCRIPTS
        value: "true"
